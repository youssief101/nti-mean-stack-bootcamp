<app-header></app-header>

<div class="container-fluid mt-3">
  <div class="row">
    <div class="col-md-3">
      <app-side-menu></app-side-menu>
    </div>

    <div class="col-md-9">
      <router-outlet></router-outlet>
      <h2 class="mt-5">
      Shopping Cart
      </h2>

      <table class="table table-striped">

      <tr>

      <th>ID</th>

      <th>Name</th>

      <th>Price</th>

      </tr>

      <tr *ngFor="let item of Cart">

      <td>{{item.ID}}</td>

      <td>{{item.Name}}</td>

      <td>{{item.Price}}</td>

      </tr>

      </table>
    </div>
  </div>
</div>

<app-footer></app-footer>
