<input
  type="number"
  class="form-control"
  [(ngModel)]="Filter">

<app-products
[FilterPrice]="Filter"
(ProductBought)="OnProductBought($event)">
</app-products>

<hr>

<h3>Shopping Cart</h3>
<table class="table table-striped">
  <thead>
    <tr>
      <th>ID</th>
      <th>Name</th>
      <th>Price</th>
      <th>Quantity</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let item of Cart">
      <td>{{item.ID}}</td>
      <td>{{item.Name}}</td>
      <td>{{item.Price | currency:'EGP'}}</td>
      <td>{{item.Quantity}}</td>
    </tr>
  </tbody>
</table>
